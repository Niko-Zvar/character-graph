name: CI

on:
  push:
    branches: [main, exam-base]
  pull_request:
    branches: [main, exam-base]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Lint (ruff)
        run: uvx ruff check .

      - name: Format check (ruff)
        run: uvx ruff format --check .

      - name: Tests (pytest)
        run: |
          if [ -f pyproject.toml ] && [ -d tests ]; then
            uv run pytest
          else
            echo "Тестов пока нет, шаг пропущен"
          fi
